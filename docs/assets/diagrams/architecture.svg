<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="100%" height="auto">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <linearGradient id="colGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0c2340" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="colGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#261042" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="colGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#332104" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="colGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04291e" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#a855f7" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#fbbf24" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#10b981" />
    </marker>

    <!-- Drop Shadows -->
    <filter id="shadowCard" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="660" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Header -->
  <text x="600" y="46" fill="#f8fafc" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="1">
    CLAIRVOY ARCHITECTURE &amp; DATA FLOW
  </text>
  <text x="600" y="70" fill="#94a3b8" font-size="13" font-weight="500" text-anchor="middle">
    Ultra-Fast, 100% Offline Pure Rust Multimodal Deduplication Engine
  </text>

  <!-- ========================================================================= -->
  <!-- COLUMN 1: STORAGE INGESTION                                               -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 100)" filter="url(#shadowCard)">
    <rect width="250" height="400" rx="14" fill="url(#colGrad1)" stroke="#38bdf8" stroke-width="2" />
    <rect x="16" y="14" width="218" height="28" rx="6" fill="#0369a1" />
    <text x="125" y="33" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">
      1. STORAGE INGESTION
    </text>

    <!-- Source Box -->
    <g transform="translate(16, 56)">
      <rect width="218" height="110" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />
      <text x="18" y="28" fill="#38bdf8" font-size="14" font-weight="700">📁 Scanned Volumes</text>
      <text x="18" y="52" fill="#cbd5e1" font-size="12">• ~/Pictures &amp; ~/Photos</text>
      <text x="18" y="72" fill="#cbd5e1" font-size="12">• ~/Downloads &amp; Backups</text>
      <text x="18" y="92" fill="#cbd5e1" font-size="12">• External SSDs &amp; NAS</text>
    </g>

    <!-- Connector 1 -->
    <path d="M 125 174 L 125 210" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowCyan)" />
    <rect x="75" y="184" width="100" height="16" rx="4" fill="#070b14" />
    <text x="125" y="196" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">Streaming Flow</text>

    <!-- Crawler Box -->
    <g transform="translate(16, 218)">
      <rect width="218" height="164" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="1.5" />
      <text x="18" y="28" fill="#38bdf8" font-size="14" font-weight="700">⚡ Streaming Crawler</text>
      <text x="18" y="48" fill="#7dd3fc" font-size="11" font-family="monospace">jwalk + flume channel</text>
      
      <rect x="14" y="60" width="190" height="42" rx="6" fill="#0c2340" />
      <text x="109" y="77" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">STRICT MEMORY CEILING</text>
      <text x="109" y="93" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">≤ 50 MB RAM</text>

      <text x="18" y="122" fill="#cbd5e1" font-size="12">• Bounded channel (2048)</text>
      <text x="18" y="142" fill="#cbd5e1" font-size="12">• 100k+ files/sec throughput</text>
    </g>
  </g>

  <!-- Connect Col 1 -> Col 2 -->
  <path d="M 295 285 L 325 285" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowCyan)" />

  <!-- ========================================================================= -->
  <!-- COLUMN 2: MULTI-TIER DETECTION                                            -->
  <!-- ========================================================================= -->
  <g transform="translate(330, 100)" filter="url(#shadowCard)">
    <rect width="250" height="400" rx="14" fill="url(#colGrad2)" stroke="#a855f7" stroke-width="2" />
    <rect x="16" y="14" width="218" height="28" rx="6" fill="#7e22ce" />
    <text x="125" y="33" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">
      2. DETECTION CASCADE
    </text>

    <!-- Tier 1 Box -->
    <g transform="translate(16, 56)">
      <rect width="218" height="136" rx="10" fill="#0f172a" stroke="#34d399" stroke-width="1.5" />
      <text x="18" y="28" fill="#34d399" font-size="14" font-weight="700">🎯 Tier 1: Exact Hash</text>
      <text x="18" y="48" fill="#a7f3d0" font-size="11" font-family="monospace">ExactHashMatcherPlugin</text>
      <text x="18" y="72" fill="#cbd5e1" font-size="12">• Parallel BLAKE3 SIMD</text>
      <text x="18" y="92" fill="#cbd5e1" font-size="12">• <tspan font-weight="700" fill="#34d399">8x faster</tspan> than SHA-256</text>
      <text x="18" y="112" fill="#cbd5e1" font-size="12">• Prunes exact byte duplicates</text>
    </g>

    <!-- Connector 2 -->
    <path d="M 125 200 L 125 228" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)" />
    <rect x="65" y="206" width="120" height="16" rx="4" fill="#070b14" />
    <text x="125" y="218" fill="#c084fc" font-size="10" font-weight="600" text-anchor="middle">Pass Similar Unmatched</text>

    <!-- Tier 2 Box -->
    <g transform="translate(16, 236)">
      <rect width="218" height="146" rx="10" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
      <text x="18" y="28" fill="#c084fc" font-size="14" font-weight="700">👁️ Tier 2: AI Vision</text>
      <text x="18" y="48" fill="#e9d5ff" font-size="11" font-family="monospace">PhotoVisionMatcherPlugin</text>
      <text x="18" y="72" fill="#cbd5e1" font-size="12">• 64-bit Perceptual dHash</text>
      <text x="18" y="92" fill="#cbd5e1" font-size="12">• ONNX Vision Model Registry</text>
      <text x="18" y="112" fill="#cbd5e1" font-size="12">• Resized, edited &amp; burst photos</text>
      <text x="18" y="132" fill="#cbd5e1" font-size="12">• Hamming distance matching</text>
    </g>
  </g>

  <!-- Connect Col 2 -> Col 3 -->
  <path d="M 585 285 L 615 285" stroke="#a855f7" stroke-width="2.5" marker-end="url(#arrowPurple)" />

  <!-- ========================================================================= -->
  <!-- COLUMN 3: KEEPER SELECTION                                                -->
  <!-- ========================================================================= -->
  <g transform="translate(620, 100)" filter="url(#shadowCard)">
    <rect width="250" height="400" rx="14" fill="url(#colGrad3)" stroke="#fbbf24" stroke-width="2" />
    <rect x="16" y="14" width="218" height="28" rx="6" fill="#d97706" />
    <text x="125" y="33" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">
      3. KEEPER DECISION
    </text>

    <!-- Keeper Engine Box -->
    <g transform="translate(16, 56)">
      <rect width="218" height="326" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="18" y="28" fill="#fbbf24" font-size="14" font-weight="700">🧠 Composite Keeper</text>
      <text x="18" y="48" fill="#fde68a" font-size="11" font-family="monospace">KeeperStrategy Scoring</text>

      <rect x="14" y="60" width="190" height="44" rx="6" fill="#451a03" />
      <text x="109" y="77" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">ZERO ACCIDENTAL LOSS</text>
      <text x="109" y="93" fill="#ffffff" font-size="11" font-weight="800" text-anchor="middle">KEEPER NEVER UNLINKED</text>

      <text x="18" y="128" fill="#fef3c7" font-size="12" font-weight="700">Scoring Engine Bonuses:</text>
      <text x="18" y="152" fill="#cbd5e1" font-size="12">• <tspan font-weight="700" fill="#fbbf24">+50 pts:</tspan> Seniority (oldest mtime)</text>
      <text x="18" y="174" fill="#cbd5e1" font-size="12">• <tspan font-weight="700" fill="#fbbf24">+30 pts:</tspan> Original raw/lossless</text>
      <text x="18" y="196" fill="#cbd5e1" font-size="12">• <tspan font-weight="700" fill="#fbbf24">+25 pts:</tspan> Highest resolution</text>
      <text x="18" y="218" fill="#cbd5e1" font-size="12">• <tspan font-weight="700" fill="#fbbf24">+20 pts:</tspan> Cleanest directory path</text>
      <text x="18" y="240" fill="#cbd5e1" font-size="12">• <tspan font-weight="700" fill="#fbbf24">-20 pts:</tspan> 'Copy (1)', 'IMG_temp'</text>

      <rect x="14" y="258" width="190" height="52" rx="6" fill="#1e293b" />
      <text x="109" y="278" fill="#94a3b8" font-size="11" text-anchor="middle">Top Shot Studio Review:</text>
      <text x="109" y="296" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle">1-Click Keeper Swap in UI</text>
    </g>
  </g>

  <!-- Connect Col 3 -> Col 4 -->
  <path d="M 875 285 L 905 285" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrowAmber)" />

  <!-- ========================================================================= -->
  <!-- COLUMN 4: SAFE STORAGE ACTIONS                                            -->
  <!-- ========================================================================= -->
  <g transform="translate(910, 100)" filter="url(#shadowCard)">
    <rect width="250" height="400" rx="14" fill="url(#colGrad4)" stroke="#10b981" stroke-width="2" />
    <rect x="16" y="14" width="218" height="28" rx="6" fill="#059669" />
    <text x="125" y="33" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">
      4. SPACE RECOVERY
    </text>

    <!-- Action A: Safe Trash -->
    <g transform="translate(16, 56)">
      <rect width="218" height="146" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="18" y="28" fill="#34d399" font-size="14" font-weight="700">📦 Safe Soft Trash</text>
      <text x="18" y="48" fill="#6ee7b7" font-size="11" font-family="monospace">--mode trash (Default)</text>
      <text x="18" y="72" fill="#cbd5e1" font-size="12">• Isolated in .clairvoy_trash/</text>
      <text x="18" y="92" fill="#cbd5e1" font-size="12">• JSON rollback manifest</text>
      <text x="18" y="112" fill="#cbd5e1" font-size="12">• 1-Click UI restoration</text>
      <text x="18" y="132" fill="#cbd5e1" font-size="12">• Zero risk of data loss</text>
    </g>

    <!-- Action B: Zero-Space Hardlink -->
    <g transform="translate(16, 218)">
      <rect width="218" height="164" rx="10" fill="#0f172a" stroke="#059669" stroke-width="1.5" />
      <text x="18" y="28" fill="#34d399" font-size="14" font-weight="700">🔗 Zero-Space Hardlink</text>
      <text x="18" y="48" fill="#6ee7b7" font-size="11" font-family="monospace">--mode hardlink</text>

      <rect x="14" y="60" width="190" height="42" rx="6" fill="#064e3b" />
      <text x="109" y="77" fill="#34d399" font-size="11" font-weight="700" text-anchor="middle">INSTANT SPACE SAVINGS</text>
      <text x="109" y="93" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">100% Wasted Disk Freed</text>

      <text x="18" y="122" fill="#cbd5e1" font-size="12">• Atomic inode replacement</text>
      <text x="18" y="142" fill="#cbd5e1" font-size="12">• Zero broken file paths</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM ROW: AUTONOMOUS BACKGROUND SURVEILLANCE                            -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 526)" filter="url(#shadowCard)">
    <rect width="1120" height="100" rx="12" fill="#0f172a" stroke="#6366f1" stroke-width="1.8" stroke-dasharray="8 6" />
    
    <!-- Live Status Indicator -->
    <circle cx="36" cy="36" r="8" fill="#10b981" />
    <circle cx="36" cy="36" r="14" fill="#10b981" fill-opacity="0.2" />

    <text x="64" y="40" fill="#f8fafc" font-size="15" font-weight="800">
      👁️ Autonomous Background Surveillance Daemon &amp; SQLite WAL Persistence
    </text>
    <text x="64" y="62" fill="#94a3b8" font-size="12">
      • Linux inotify / macOS FSEvents continuous filesystem surveillance with sliding quiet debounce window
    </text>
    <text x="64" y="80" fill="#94a3b8" font-size="12">
      • Embedded ACID database at <tspan fill="#818cf8" font-family="monospace">~/.clairvoy/clairvoy.db</tspan> — instant incremental cache, zero re-scanning, zero idle CPU
    </text>

    <!-- Quick Stats Pill -->
    <rect x="910" y="24" width="186" height="52" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.2" />
    <text x="1003" y="45" fill="#a5b4fc" font-size="11" font-weight="700" text-anchor="middle">BACKGROUND SURVEILLANCE</text>
    <text x="1003" y="63" fill="#ffffff" font-size="12" font-weight="800" text-anchor="middle">Live Reactive SSE Feed</text>
  </g>
</svg>
